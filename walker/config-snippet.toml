# Merge into ~/.config/walker/config.toml (only this set + actions, nothing else).
theme = "noctalia"

[providers.sets.utilmenu]
default = ["menus:utilsearch", "menus:utilmenu"]
empty = ["menus:utilmenu"]

# Native: menus:open navigates (submenu), default executes.
# Return = the entry's default action (open OR run, per entry type).
[providers.actions]
"menus:utilmenu" = [
  { action = "menus:open", bind = "Return", default = true, after = "ClearReload" },
  { action = "menus:open", bind = "Right", after = "ClearReload" },
  { action = "menus:parent", bind = "Left", after = "ClearReload" },
  { action = "menus:parent", bind = "BackSpace", after = "ClearReload" },
  { action = "menus:parent", bind = "Escape", after = "ClearReload" },
]
