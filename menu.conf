# Format:
#   action|id|parent_id|glyph-hex|label|handler|alias|desc
# glyph-hex = Nerd-Font-Codepoint ohne U+, z.B. F003B
# Root-Kategorien: parent_id=root, handler=submenu:<id> (navigiert generisch).
# Tiefe beliebig: parent_id verweist auf eine Kategorie-ID.
# search: root-Eintraege (parent=root) searchable=0, alle anderen searchable=1.
# Apps: desktop apps are attached dynamically under parent=apps.

