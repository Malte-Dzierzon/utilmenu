# Format:
#   menu|id|parent_id|glyph-hex|label
#   action|id|parent_id|glyph-hex|label|handler|alias|desc
# glyph-hex = Nerd-Font-Codepoint ohne U+, z.B. F003B
# parent_id leer = letzter menu-Kontext (Rückwärtskompatibilität)
# Root-Kategorien: parent_id=root (oder leer nach menu|root)
# is_root flag für die 8 Hauptkategorien: action|id|root|...

action|apps|root|F003B|Apps|submenu:apps||
action|style|root|EBCF|Style|submenu:style||
action|setup|root|E615|Setup|submenu:setup||
action|install|root|F0249|Install|submenu:install||
action|remove|root|F0B4C|Remove|submenu:remove||
action|nixos|root|F313|Nixos|submenu:nixos||
action|about|root|EA74|About|run:about||
action|system|root|F011|System|submenu:system||

menu|apps|root|0|Apps
menu|style|root|0|Style
action|style-bg|style|F03E|Background|run:style-bg||
action|style-bar|style|F035C|Menu Bar|run:style-bar||
action|style-niri|style|E615|Niri Config|run:style-niri||
action|style-mango|style|E615|Mango Config|run:style-mango||

menu|setup|root|0|Setup
action|setup-mon|setup|F0379|Monitors|run:setup-mon||
action|setup-keys|setup|F11C|Keybindings|run:setup-keys||
action|setup-input|setup|EFBA|Input|run:setup-input||
action|setup-net|setup|F06F3|Network|run:setup-net||
action|setup-audio|setup|F0280|Audio|run:setup-audio||
action|setup-wiremix|setup|F120|Wiremix|run:setup-wiremix||
action|setup-defaults|setup|F005|Defaults|run:setup-defaults||

menu|nixos|root|0|Nixos
action|nixos-version|nixos|F313|Version|run:nixos-version||
action|nixos-switch|nixos|F313|Rebuild & Switch|run:nixos-switch||
action|nixos-test|nixos|F313|Test Build|run:nixos-test||
action|nixos-update|nixos|F313|Update Flake|run:nixos-update||
action|nixos-gc|nixos|F313|Garbage Collect|run:nixos-gc||
action|nixos-gens|nixos|F313|Generations|run:nixos-gens||

menu|system|root|0|System
action|sys-save|system|F1104|Screensaver|run:sys-save||
action|sys-lock|system|F023|Lock|run:sys-lock||
action|sys-sleep|system|F04B2|Suspend|run:sys-sleep||
action|sys-out|system|F0343|Logout|run:sys-out||
action|sys-reboot|system|F0709|Reboot|run:sys-reboot||
action|sys-off|system|F0425|Shutdown|run:sys-off||

menu|install|root|0|Install
action|later-install|install|F0249|Kommt mit dem NixOS-Manager…|run:later||

menu|remove|root|0|Remove
action|later-remove|remove|F0249|Kommt mit dem NixOS-Manager…|run:later||

